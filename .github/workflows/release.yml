name: Release

# Manually triggered only (Actions tab -> "Run workflow", or `gh workflow run
# release.yml`). We intentionally do NOT trigger on tag push: a tag created
# by a local `git tag`/`git push --tags` is never GitHub-signed, so it never
# shows the "Verified" badge. Instead, the local release step is
# `npm version <bump> --no-git-tag-version` (bumps manifest.json/
# versions.json via the existing "version" script, but creates no commit or
# tag) followed by a normal commit+push — then THIS workflow reads the
# version straight from manifest.json and has `gh release create` create the
# tag itself via the API, which IS GitHub-signed and Verified.
on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Build plugin
        run: npm run build

      # GitHub Artifact Attestation is not supported at all for private
      # repositories owned by a personal account. So attestation is only
      # attempted when the repository is public, while the build/release
      # always proceeds regardless of visibility.
      - name: Check repo visibility
        id: visibility
        run: |
          visibility=$(gh repo view "${{ github.repository }}" --json visibility -q .visibility)
          echo "is-public=$([ "$visibility" = "PUBLIC" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest build provenance
        if: steps.visibility.outputs.is-public == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/main.js
            dist/manifest.json
            dist/styles.css

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The tag name is read straight from the version committed to
          # manifest.json rather than from a git ref (it was bumped locally
          # with `npm version --no-git-tag-version` and pushed to main
          # already — see the `on:` comment above).
          tag=$(node -p "require('./manifest.json').version")
          echo "Releasing version $tag"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists. Bump the version locally before re-running this workflow."
            exit 1
          fi

          # The release notes are taken verbatim from the latest "## Changelog"
          # entry in README.md (hand-written wording rather than the raw
          # commit log). It fails if that entry's version differs from $tag —
          # a safeguard against forgetting to update the README before a
          # release.
          node .github/scripts/extract-changelog.mjs "$tag" README.md changelog.txt

          # The tag does not exist yet, so --target must name this commit
          # explicitly for gh to create the tag at that point — only a tag
          # created through the API carries the GitHub "Verified" signature.
          gh release create "$tag" \
            --title "$tag" \
            --notes-file changelog.txt \
            --target "$GITHUB_SHA" \
            dist/main.js \
            dist/manifest.json \
            dist/styles.css

